<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>混沌密文 · 中英数标点加密</title>
  <style>
    :root {
      --bg: #070a12;
      --card: rgba(20, 27, 43, 0.88);
      --line: rgba(148, 180, 255, 0.14);
      --text: #eef3ff;
      --muted: #8e9cb8;
      --accent: #5b8cff;
      --accent-2: #8b5cf6;
      --field: rgba(7, 11, 20, 0.65);
    }
    * {
      box-sizing: border-box;
      font-family: system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }
    body {
      background:
        radial-gradient(720px 420px at 12% -8%, rgba(91, 140, 255, 0.22), transparent 60%),
        radial-gradient(680px 420px at 105% 110%, rgba(139, 92, 246, 0.18), transparent 60%),
        var(--bg);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      padding: 1.5rem 1rem;
      color: var(--text);
    }
    .card {
      max-width: 860px;
      width: 100%;
      background: linear-gradient(180deg, rgba(255,255,255,0.035), rgba(255,255,255,0) 42%), var(--card);
      border: 1px solid var(--line);
      border-radius: 1.75rem;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
      padding: clamp(1.25rem, 4vw, 2.25rem);
      backdrop-filter: blur(10px);
    }
    .header {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      margin-bottom: 1.75rem;
    }
    .logo {
      width: 52px;
      height: 52px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      font-size: 1.55rem;
      border-radius: 1rem;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 10px 24px rgba(91, 140, 255, 0.35);
    }
    h1 {
      font-size: clamp(1.55rem, 4vw, 1.9rem);
      font-weight: 700;
      letter-spacing: 2px;
      margin: 0;
      line-height: 1.15;
    }
    .tag {
      margin-top: 0.3rem;
      font-size: 0.68rem;
      letter-spacing: 3.5px;
      text-transform: uppercase;
      color: var(--muted);
    }
    .pill {
      margin-left: auto;
      flex: 0 0 auto;
      font-size: 0.78rem;
      color: #bcd0ff;
      background: rgba(91, 140, 255, 0.10);
      border: 1px solid rgba(148, 180, 255, 0.22);
      padding: 0.38rem 0.85rem;
      border-radius: 999px;
    }
    .panel {
      display: flex;
      flex-direction: column;
      gap: 1.15rem;
    }
    .io-group, .channel-group {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .channel-group {
      flex-direction: row;
      align-items: center;
      gap: 0.9rem;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--line);
      border-radius: 1.1rem;
      padding: 0.8rem 1rem;
    }
    .channel-group label {
      white-space: nowrap;
    }
    .channel-group select {
      flex: 1;
    }
    label {
      font-size: 0.85rem;
      letter-spacing: 0.5px;
      color: #a9bad6;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    label i {
      font-style: normal;
      background: rgba(91, 140, 255, 0.12);
      border-radius: 999px;
      padding: 0.12rem 0.65rem;
      font-size: 0.72rem;
      color: #a9c2ff;
    }
    textarea, select {
      width: 100%;
      padding: 0.9rem 1.05rem;
      background: var(--field);
      border: 1px solid rgba(148, 180, 255, 0.16);
      border-radius: 1.05rem;
      color: #e6eeff;
      font-size: 0.98rem;
      line-height: 1.6;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    textarea {
      resize: vertical;
      font-family: ui-monospace, 'SF Mono', 'Fira Code', monospace;
      letter-spacing: 0.3px;
    }
    textarea[readonly] {
      color: #c9dcff;
      background: rgba(10, 16, 28, 0.85);
    }
    select {
      cursor: pointer;
      width: auto;
    }
    textarea:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(91, 140, 255, 0.18);
    }
    textarea::placeholder {
      color: #55637d;
    }
    .btn-row {
      display: flex;
      gap: 0.65rem;
      flex-wrap: wrap;
    }
    button {
      border: 1px solid transparent;
      border-radius: 0.95rem;
      padding: 0.85rem 1.5rem;
      font-size: 0.98rem;
      font-weight: 600;
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
      flex: 1 0 auto;
      letter-spacing: 0.5px;
    }
    button.primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 10px 22px rgba(91, 140, 255, 0.28);
    }
    button.primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 26px rgba(91, 140, 255, 0.32);
    }
    button.secondary {
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(148, 180, 255, 0.20);
      color: #dbe7ff;
    }
    button.secondary:hover {
      background: rgba(255, 255, 255, 0.08);
      transform: translateY(-1px);
    }
    button:active {
      transform: translateY(1px);
      box-shadow: none;
    }
    button:disabled {
      opacity: 0.5;
      pointer-events: none;
    }
    .error-message {
      color: #ff9d9d;
      font-size: 0.85rem;
      min-height: 1.25rem;
      padding-left: 0.25rem;
    }
    .error-message:empty {
      min-height: 0;
    }
    @media (max-width: 560px) {
      body { padding: 0.75rem; }
      .card { border-radius: 1.35rem; }
      .pill { display: none; }
      .channel-group { flex-direction: column; align-items: stretch; }
      .channel-group select { width: 100%; }
      .btn-row button { flex: 1 1 9rem; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="logo">⚡</div>
      <div>
        <h1>混沌密文</h1>
        <div class="tag">Chaos Cipher</div>
      </div>
      <span class="pill">中英数标点</span>
    </div>

    <div class="panel">
      <!-- 输入区域 -->
      <div class="io-group">
        <label>📥 原始文本 / 密文</label>
        <textarea id="inputText" rows="4" placeholder="输入文本，或粘贴密文…"></textarea>
      </div>

      <!-- 频道选择 -->
      <div class="channel-group">
        <label>📻 频道 <i>1–100</i></label>
        <select id="channelSelect" aria-label="选择频道"></select>
      </div>

      <!-- 操作按钮 -->
      <div class="btn-row">
        <button class="primary" id="encryptBtn">🔒 加密 → 混沌码</button>
        <button class="secondary" id="decryptBtn">🔓 解密 → 还原文本</button>
        <button class="secondary" id="clearBtn" style="flex: 0.5;">✖ 清空</button>
      </div>

      <!-- 输出区域 -->
      <div class="io-group">
        <label>
          📤 输出结果
          <i id="outputHint">加密/解密结果</i>
        </label>
        <textarea id="outputText" rows="4" placeholder="结果会显示在这里..." readonly></textarea>
      </div>

      <!-- 状态及错误 -->
      <div class="error-message" id="errorMsg"></div>

    </div>
  </div>

  <script>
    (function() {
      // ----- 核心编码系统 -----
      // 每个字符转成 Unicode 码点 (0 ~ 0x10FFFF)
      // 为了避免过于简单，采用固定系统:
      // 每个字符 → 8位十六进制 (填充到6位) + 2位校验码? 
      // 但题目希望 "一堆看似杂乱无章的字母或数字" 且固定系统且支持所有字符。
      // 设计: 对每个字符的码点 用固定公式转成 "x" + 十六进制码点(6位) + 2位校验码(基于码点计算) 
      // 这样总长度9个字符? 但看起来有字母数字混合。
      // 但为了更有"杂乱感"且保证可逆, 采用: 每个字符 → 4位随机字母 + 3位十六进制 + 2位校验? 不, 随机不可逆。
      // 要可逆且固定系统，不能真随机。
      // 于是采用: 每个字符的 Unicode 码点 转成 8位十六进制(不足补0) + 2位基于码点的校验和(十六进制) = 10个字符。
      // 但为了更像"杂乱无章", 让每个码点先做一个固定的位混淆(但不影响可逆) 再转十六进制。
      // 我们采用一种固定置换: 码点 ^ 0x5A5A (异或常量) 然后转十六进制8位 (码点最大0x10FFFF, 异或后不超过0x10FFFF, 8位够)
      // 再额外加2位校验码 (基于原码点的简单函数) 为了让密文更长且更杂, 但校验位也是固定的, 不破坏可逆。
      // 但解密时需要移除校验位并反异或。为了更"杂乱", 把异或后的8位十六进制每个字符再映射成字母/数字? 
      // 不, 继续用十六进制, 但用大小写混合加数字看起来就像杂乱字母数字。但注意大小写敏感, 容易混淆, 因此改为统一大写或小写? 
      // 但为了视觉杂乱, 可以让数字和字母混合: 十六进制本身就有0-9,A-F, 看起来像字母数字混合。
      // 再增加2位随机? 但随机不可逆。所以改为: 每个字符 → 8位十六进制码点异或后 + 2位基于此异或值的校验码(也是十六进制) = 10位。
      // 然后整个密文块之间可以用分隔符? 但为了更像"一堆杂乱", 不添加额外分隔符, 因为每个块固定10位字符, 解密时每10位分割。
      // 但Unicode代理对? JS中字符串按UTF-16码元, 对于超出BMP的字符(如emoji)是两个码元, 我们按码元处理会导致无法还原？实际上可以按码元处理，每个码元作为一个"字符"处理，加密解密都按码元，所以没问题。
      // 但用户输入"𠮷"等增补字符时，JS会当成两个码元，每个码元单独加密，解密后两个码元拼回去一样可以还原。所以完美支持所有UTF-16字符串。
      // 但中文简繁体都在BMP内，所以都是单个码元。
      // 每个码元: 16位(0~65535) → 8位十六进制(4位十六进制? 0xFFFF是4位十六进制, 但为了统一用8位补零) 
      // 实际0xFFFF → "0000FFFF", 8位。 异或0x5A5A后范围仍0~0xFFFF, 仍是8位十六进制 (因为0xFFFF ^ 0x5A5A = 0xA5A5 等) 
      // 然后生成2位校验: (code ^ 0xABCD) & 0xFF 转十六进制两位。总共10位。
      // 解密: 每10位一组, 取前8位转成数字, 异或0x5A5A得到原始码元, 后2位校验(可选验证), 然后fromCharCode。
      // 为了更杂乱, 我们把十六进制字符中的字母随机大小写? 但大小写会导致解密时需统一, 可以解密时统一转大写。但那样会损失"杂乱感"且容易混淆。
      // 或者采用Base36? 但十六进制已经够。
      // 为了更像"杂乱无章", 我们可以在加密时将码点先进行一个简单的线性变换: (code * 37 + 17) & 0xFFFF, 但乘法可能导致冲突? 因为是模65536且37与65536互质，所以可逆。这个更好，看起来更不像直接十六进制。
      // 但解密需要求逆: 先减17再乘37的模逆。模逆存在因为gcd(37,65536)=1。37的模逆? 37*? ≡1 mod 65536。可计算。
      // 但为了简洁且保证可逆，使用异或足够，而且十六进制字符0-9A-F本身就像字母数字混合。
      // 我们就用异或0x5A5A, 然后转为8位十六进制(大写)，再加2位校验: 基于原码点异或0xABCD的低8位。
      // 这样每个字符加密后长度为10个字符 (8+2)，且只包含0-9A-F，看起来像杂乱的字母数字。
      // 但全是A-F和数字，稍微有点规律，但每组10位，整体很杂乱。
      // 还嫌不够杂乱? 可以加一个固定的置换表将十六进制字符映射到字母数字? 但为了简单还是保持。
      // 另外为了更像"密文"，可以考虑在两组之间插入随机分隔符？不行，那样不可逆。
      // 最终决定: 每个字符变成10位十六进制字符串（大写），最后整体密文不加分隔。解密时每10位还原。
      
      // 校验和的计算: 为了增加复杂度，使用原码元与0xABCD异或后 & 0xFF，转两位十六进制。
      // 但验证校验可以防止解密错误，但解密时我们直接还原，不强制验证(可选)。
      
      // ----- 频道系统 -----
      // 频道 1-100，每个频道都有一套不同的转换参数:
      //   xorVal(异或值) / mul(乘数,奇数,模65536可逆) / add(加数) / checkVal(校验常量)
      // 加密: 先异或，再做仿射变换 obfuscated = ((code ^ xorVal) * mul + add) mod 65536
      // 解密: 先做仿射逆变换，再异或，并用该频道的校验常量验证，频道不对校验就会失败。
      // 频道 1 特意保留旧版参数 (mul=1, add=0, xor=0x5A5A, check=0xABCD)，
      // 因此旧版无频道时加密出的密文，用频道 1 可以直接解密。
      function modInverseOdd(a) {
        // 求奇数 a 在模 65536 下的乘法逆元 (扩展欧几里得)
        let t = 0, newT = 1, r = 65536, newR = a % 65536;
        while (newR !== 0) {
          const q = Math.floor(r / newR);
          const tmpT = t - q * newT; t = newT; newT = tmpT;
          const tmpR = r - q * newR; r = newR; newR = tmpR;
        }
        if (t < 0) t += 65536;
        return t;
      }

      function getChannelParams(channel) {
        const ch = Math.min(100, Math.max(1, parseInt(channel, 10) || 1));
        if (ch === 1) {
          return { channel: 1, xorVal: 0x5A5A, mul: 1, add: 0, checkVal: 0xABCD, invMul: 1 };
        }
        // 用频道号做种子，确定性地生成该频道专属参数 (同一频道每次都相同)
        let s = (ch * 2654435761) >>> 0;
        function nextRand() {
          // xorshift32
          s ^= (s << 13) >>> 0; s >>>= 0;
          s ^= s >> 17;
          s ^= (s << 5) >>> 0; s >>>= 0;
          return s >>> 0;
        }
        const xorVal = nextRand() & 0xFFFF;
        let mul = nextRand() & 0xFFFF;
        mul = (mul | 1) & 0xFFFF; // 强制奇数，保证模 65536 可逆
        if (mul === 1) mul = 0x9E37; // 避免与频道 1 退化成同一逻辑
        const add = nextRand() & 0xFFFF;
        const checkVal = nextRand() & 0xFFFF;
        return { channel: ch, xorVal, mul, add, checkVal, invMul: modInverseOdd(mul) };
      }

      // 加密函数 (按所选频道)
      function encryptChar(code, params) {
        const temp = (code ^ params.xorVal) & 0xFFFF;
        const obfuscated = (temp * params.mul + params.add) & 0xFFFF;
        let hex8 = obfuscated.toString(16).toUpperCase().padStart(8, '0');
        const check = ((code ^ params.checkVal) & 0xFF).toString(16).toUpperCase().padStart(2, '0');
        return hex8 + check; // 10位
      }

      // 解密单个块: 输入10位字符串, 返回码元数字(整数), 如果无效返回NaN
      function decryptBlock(block, params) {
        if (block.length !== 10) return NaN;
        const hexPart = block.slice(0, 8);
        const checkPart = block.slice(8, 10);
        const hexRegex = /^[0-9A-Fa-f]{8}$/;
        const checkRegex = /^[0-9A-Fa-f]{2}$/;
        if (!hexRegex.test(hexPart) || !checkRegex.test(checkPart)) return NaN;

        const obfuscated = parseInt(hexPart, 16);
        // 仿射逆变换: temp = (obfuscated - add) * invMul mod 65536
        let diff = (obfuscated - params.add) % 65536;
        if (diff < 0) diff += 65536;
        const temp = (diff * params.invMul) & 0xFFFF;
        const code = (temp ^ params.xorVal) & 0xFFFF;

        // 用该频道的校验常量验证，频道不对时这里会失败
        const expectedCheck = ((code ^ params.checkVal) & 0xFF).toString(16).toUpperCase().padStart(2, '0');
        if (checkPart.toUpperCase() !== expectedCheck) {
          return NaN;
        }
        return code;
      }

      // 加密完整字符串 (按所选频道)
      function encryptText(text, channel) {
        const params = getChannelParams(channel);
        let result = '';
        for (let i = 0; i < text.length; i++) {
          const code = text.charCodeAt(i); // UTF-16码元
          result += encryptChar(code, params);
        }
        return result;
      }

      // 解密完整字符串 (按所选频道，频道不对会校验失败)
      function decryptText(encrypted, channel) {
        const params = getChannelParams(channel);
        // 移除所有空白字符? 不应该移除，因为密文中可能包含空格吗? 密文只包含0-9A-F，不会包含空格。但用户可能不小心输入空格，我们保留非十六进制字符? 但为了鲁棒，我们只保留十六进制字符。
        // 但可能会破坏结构，所以我们采用严格方式：先把输入字符串中的空白字符移除？但有可能用户想包含空格作为密文一部分? 但密文本身不会产生空格，所以移除空格安全。
        // 更好的: 我们假设用户输入的密文只包含0-9A-F大写或小写，可能夹杂空格？我们去除所有非十六进制字符。
        // 但去除会破坏长度，如果用户输入的密文实际上应该全部是十六进制字符，我们只需去除空白字符？为了容错，去除空格、换行、制表符。
        // 但考虑复制粘贴可能带换行，我们移除所有空白字符。
        const cleaned = encrypted.replace(/\s+/g, '').toUpperCase(); // 统一大写
        // 检查长度是否为10的倍数
        if (cleaned.length % 10 !== 0) {
          // 可能是长度不对，但仍然尝试尽可能解密？
          // 但为了正确性，抛出错误提示。
          throw new Error('密文长度无效 (应为10的倍数)');
        }
        let result = '';
        for (let i = 0; i < cleaned.length; i += 10) {
          const block = cleaned.slice(i, i + 10);
          const code = decryptBlock(block, params);
          if (isNaN(code)) {
            throw new Error(`无法解密片段: ${block}（请确认频道是否正确，当前为频道 ${params.channel}，或密文是否完整）`);
          }
          result += String.fromCharCode(code);
        }
        return result;
      }

      // ----- DOM 元素 -----
      const inputText = document.getElementById('inputText');
      const outputText = document.getElementById('outputText');
      const encryptBtn = document.getElementById('encryptBtn');
      const decryptBtn = document.getElementById('decryptBtn');
      const clearBtn = document.getElementById('clearBtn');
      const errorMsg = document.getElementById('errorMsg');
      const outputHint = document.getElementById('outputHint');
      const channelSelect = document.getElementById('channelSelect');

      // 填充频道选项 1-100，默认频道 1 (兼容旧版密文)
      for (let i = 1; i <= 100; i++) {
        const opt = document.createElement('option');
        opt.value = String(i);
        opt.textContent = i === 1 ? '频道 1（兼容旧版）' : `频道 ${i}`;
        channelSelect.appendChild(opt);
      }
      channelSelect.value = '1';

      function getSelectedChannel() {
        return Math.min(100, Math.max(1, parseInt(channelSelect.value, 10) || 1));
      }

      // 清除错误信息
      function clearError() {
        errorMsg.textContent = '';
      }

      // 显示错误
      function showError(msg) {
        errorMsg.textContent = msg;
      }

      // 加密操作
      function handleEncrypt() {
        clearError();
        const input = inputText.value;
        if (input.length === 0) {
          showError('请输入要加密的文本');
          outputText.value = '';
          outputHint.textContent = '加密结果';
          return;
        }
        try {
          const channel = getSelectedChannel();
          const encrypted = encryptText(input, channel);
          outputText.value = encrypted;
          outputHint.textContent = `加密结果 · 频道 ${channel} · 每10位对应一个字符 · 解密时请选择同一频道`;
        } catch (e) {
          showError('加密失败: ' + e.message);
        }
      }

      // 解密操作
      function handleDecrypt() {
        clearError();
        const input = inputText.value.trim();
        if (input.length === 0) {
          showError('请输入要解密的密文');
          outputText.value = '';
          outputHint.textContent = '解密结果';
          return;
        }
        // 去除可能存在的空格和换行用于解密，但保留原输入用于显示
        try {
          const channel = getSelectedChannel();
          const decrypted = decryptText(input, channel);
          outputText.value = decrypted;
          outputHint.textContent = `解密结果 · 频道 ${channel} · 原文已还原`;
        } catch (e) {
          showError('解密失败: ' + e.message);
        }
      }

      // 清空
      function handleClear() {
        inputText.value = '';
        outputText.value = '';
        clearError();
        outputHint.textContent = '加密/解密结果';
        inputText.focus();
      }

      // 绑定事件
      encryptBtn.addEventListener('click', handleEncrypt);
      decryptBtn.addEventListener('click', handleDecrypt);
      clearBtn.addEventListener('click', handleClear);

      // 额外: 输入框内按Ctrl+Enter快捷加密, 方便
      inputText.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
          e.preventDefault();
          handleEncrypt();
        }
      });

      // 初始化一些示例，但为了不干扰用户，不自动填充，但可以让输入框获得焦点
      inputText.focus();

      // 测试自检(仅开发模式，可在控制台打印)
      // 验证可逆性
      (function selfTest() {
        const testStr = 'Hello 世界！123。繁體字𠮷'; // 包含增补字符
        try {
          // 全部 100 个频道都要能往返还原
          for (let ch = 1; ch <= 100; ch++) {
            const enc = encryptText(testStr, ch);
            const dec = decryptText(enc, ch);
            if (dec !== testStr) {
              console.warn(`自检失败: 频道 ${ch} 还原文本不一致`);
              return;
            }
          }
          // 频道 1 必须与旧版算法一致: 'A' → 00005A1B8C
          if (encryptText('A', 1) !== '00005A1B8C') {
            console.warn('自检失败: 频道 1 与旧版不兼容');
            return;
          }
          console.log('✅ 自检通过: 100个频道加密/解密均可逆，频道1兼容旧版');
        } catch (e) {
          console.warn('自检错误:', e);
        }
      })();

    })();
  </script>
</body>
</html>
